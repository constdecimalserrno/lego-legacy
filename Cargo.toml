[workspace]
resolver = "2"
members = [
    "core",
    "launcher",
    "titles/lego-rock-raiders",
    "titles/hotwheels-stunt-track-driver",
    "titles/lego-alpha-team",
    "titles/lego-island",
    "titles/lego-chess",
]

# ADR-0001: zero external crates, forever. Nothing may appear here or in any
# member's [dependencies] but path entries to workspace members, and
# `core/tests/zero_crates.rs` holds Cargo.lock to exactly that.
#
# ADR-0007: every member carries its own version in its own manifest, and a
# title or the launcher pins core exactly, so nothing shares a version here.
[workspace.package]
edition = "2021"
rust-version = "1.98"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/constdecimalserrno/lego-legacy"

[profile.release]
opt-level = 3
debug = true
codegen-units = 1

name: x86_64 Core Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  x86_64-core-tests:
    name: Core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.98
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal --no-self-update
          rustup default 1.98.0
          rustc --version
      - name: Run lego-legacy-core unit and interpreter tests
        shell: bash
        run: |
          cargo test -p lego-legacy-core --lib
          cargo test -p lego-legacy-core --test interp --test arch_determinism
      - name: Verify pure-Rust oracle parity toggle
        shell: bash
        env:
          LEGO_LEGACY_ARCH: rust
        run: |
          cargo test -p lego-legacy-core --test interp --test arch_determinism
